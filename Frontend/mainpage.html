<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CalibraX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=Racing+Sans+One&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <!-- HEADER -->
  <header class="header-custom">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <img src="img/logo.png" alt="Logo CalibraX" height="50">
      <nav>
        <a href="#" class="nav-link-custom mx-3">Servicios</a>
        <a href="#" class="nav-link-custom mx-3">Quienes somos</a>
        <a href="#" class="nav-link-custom mx-3">Contacto</a>
      </nav>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero-section text-center text-light py-5">
    <div class="container">
      <h2 class="mb-0">Bienvenido a</h2>
      <h1 class="display-4 fw-bold my-3">CalibraX</h1>
      <div class="mt-4">
        <button class="btn btn-light mx-2 px-4" onclick="mostrarLogin()">Iniciar Sesión</button>
        <button class="btn btn-light mx-2 px-4" onclick="mostrarRegistro()">Registrarse</button>
      </div>
      <p class="racing-text mt-4">El futuro de las cañerías, hoy</p>
    </div>
  </section>

  <!-- MODAL LOGIN -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header modal-header-custom">
          <h5 class="modal-title">INICIAR SESIÓN</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="sesionForm">
            <div class="mb-3">
              <label class="form-label">MAIL</label>
              <input type="email" class="form-control" id="Iemail" required />
            </div>
            <div class="mb-3">
              <label class="form-label">CONTRASEÑA</label>
              <input type="password" class="form-control" id="Ipassword" required />
            </div>
            <button type="submit" class="btn-orange-custom w-100">Iniciar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL REGISTRO -->
  <div class="modal fade" id="registroModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header modal-header-custom">
          <h5 class="modal-title">REGISTRO</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="registroForm">
            <div class="mb-3">
              <label class="form-label">NOMBRE</label>
              <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="mb-3">
              <label class="form-label">APELLIDO</label>
              <input type="text" class="form-control" id="apellido" required>
            </div>
            <div class="mb-3">
              <label class="form-label">DNI</label>
              <input type="text" class="form-control" id="dni" required>
            </div>
            <div class="mb-3">
              <label class="form-label">MAIL</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">CONTRASEÑA</label>
              <input type="password" class="form-control" id="password" required>
            </div>
            <div class="mb-3">
              <label class="form-label">CONFIRMAR CONTRASEÑA</label>
              <input type="password" class="form-control" id="confirmPassword" required>
            </div>
            <button type="submit" class="btn-orange-custom w-100">Registrarse</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- BOOTSTRAP & TU JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.main.js"></script>
</body>
</html>
