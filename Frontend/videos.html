<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CalibraX - Videos</title>
  <!-- Preconexiones -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <!-- Estilo personalizado -->
  <link href="css/style.css" rel="stylesheet" />
  <!-- Favicon -->
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <style>
    .video-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <!-- Barra de progreso -->
  <div id="progressBar" class="progress-bar-custom"></div>

  <!-- HEADER -->
  <header class="header-custom sticky-top">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <a href="mainpage.html" class="d-flex align-items-center text-decoration-none">
        <img src="img/logo.png" alt="Logo CalibraX" height="50" class="me-2">
        <span class="fs-4 fw-bold text-dark d-none d-md-inline">CALIBRAX</span>
      </a>
      <nav class="d-flex align-items-center">
        <a href="#" class="nav-link-custom mx-2">Servicios</a>
        <a href="#" class="nav-link-custom mx-2">Quiénes somos</a>
        <a href="#" class="nav-link-custom mx-2">Contacto</a>
        <button class="btn btn-sm btn-outline-danger ms-3" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </button>
      </nav>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="container my-5">
    <div class="row">
      <div class="col-12">
        <h2 class="mb-4">Videos Disponibles</h2>
        <div id="videosInfo" class="alert alert-info">
          Cargando videos...
        </div>
        <div class="video-container"></div>
      </div>
    </div>
  </div>

  <!-- Footer simple -->
  <footer class="footer-custom py-4">
    <div class="container text-center">
      <p class="small mb-0">© 2025 CalibraX. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script>
    function logout() {
      localStorage.removeItem('authToken');
      window.location.href = "mainpage.html";
    }

    window.addEventListener('scroll', function () {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      const progressBar = document.getElementById('progressBar');
      progressBar.style.width = scrolled + '%';
      progressBar.style.opacity = winScroll > 100 ? '1' : '0';
    });

    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('progressBar').style.opacity = '0';
    });
  </script>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App para cargar videos -->
  <script src="app.videos.js"></script>
</body>
</html>
