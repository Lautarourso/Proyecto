<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CalibraX - Proyectos</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mango+Grotesque:wght@700&family=Basement+Grotesque:wght@700&family=Hanson:wght@400;700&family=Queering:wght@400;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <!-- Estilo personalizado -->
  <link href="css/videosstyle.css" rel="stylesheet" />
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
</head>

<body>

  <!-- Fondo líquido azul -->
   <canvas id="particles-canvas"></canvas>
  <div class="liquid-bg"></div>

  <!-- Barra de progreso -->
  <div id="progressBar" class="progress-bar-custom"></div>

  <!-- HEADER -->
  <header class="header-custom sticky-top">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <a href="mainpage.html" class="d-flex align-items-center text-decoration-none">
        <img src="img/LOGOPROYECTO1.png" alt="Logo CalibraX" height="50" class="me-2">
        
      </a>
      <nav class="d-flex align-items-center">
        
        <button class="btn btn-sm btn-outline-orange ms-3" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </button>
      </nav>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="container my-5">
    <div class="row">
      <div class="col-12 d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-light mb-0">Mis Proyectos</h2>
        <button class="btn btn-orange-custom" onclick="mostrarCrearProyecto()">
          <i class="bi bi-plus-circle me-2"></i>Crear Proyecto
        </button>
      </div>

      <div id="proyectosInfo" class="alert alert-info">
        Cargando proyectos...
      </div>

      <div class="proyectos-grid" id="proyectosContainer">
        <!-- Los proyectos se cargarán aquí dinámicamente -->
      </div>
    </div>
  </div>

  <!-- MODAL CREAR PROYECTO -->
  <div id="crearProyectoModal" class="modal fade" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header modal-header-custom">
          <h5 class="modal-title">CREAR NUEVO PROYECTO</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="crearProyectoForm">
            <div class="mb-3">
              <label class="form-label">NOMBRE DEL PROYECTO</label>
              <input type="text" class="form-control" id="nombreProyecto" required>
            </div>
            <button type="submit" class="btn-orange-custom w-100">Crear Proyecto</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-custom py-4">
    <div class="container text-center">
      <p class="small mb-0">© 2025 CalibraX. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="app.videos.js"></script>
  <script>
    function logout() {
      localStorage.removeItem('authToken');
      window.location.href = "mainpage.html";
    }

    function mostrarCrearProyecto() {
      const modal = new bootstrap.Modal(document.getElementById('crearProyectoModal'));
      modal.show();
    }

    window.addEventListener('scroll', function () {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      const progressBar = document.getElementById('progressBar');
      progressBar.style.width = scrolled + '%';
      progressBar.style.opacity = winScroll > 100 ? '1' : '0';
    });

    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('progressBar').style.opacity = '0';
    });
  </script>
  <script>
document.addEventListener("DOMContentLoaded", () => {

  const canvas = document.getElementById("particles-canvas");
  const ctx = canvas.getContext("2d");

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  const particles = [];
  const totalParticles = 100;

  // Crear partículas
  for (let i = 0; i < totalParticles; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 3 + 1,
      speedX: (Math.random() - 0.5) * 0.35,
      speedY: (Math.random() - 0.5) * 0.35,
      opacity: Math.random() * 0.6 + 0.4
    });
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 140, 255, ${p.opacity})`;
      ctx.fill();
    });
  }

  function connectParticles() {
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 110) {
          ctx.beginPath();
          ctx.strokeStyle = "rgba(0, 140, 255, 0.2)";
          ctx.lineWidth = 1;
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
  }

  function moveParticles() {
    particles.forEach(p => {
      p.x += p.speedX;
      p.y += p.speedY;

      if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
      if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
    });
  }

  function animate() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; // efecto de desdibujado suave
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawParticles();
    connectParticles();
    moveParticles();

    requestAnimationFrame(animate);
  }

  animate();
});
</script>
</body>
</html>
