<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CalibraX | Mis Proyectos</title>

  <!-- Fuentes: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  
  <!-- Estilo personalizado -->
  <link href="css/mainstyle.css" rel="stylesheet" /> <!-- Usamos mainstyle para los fondos -->
  <link href="css/videosstyle.css" rel="stylesheet" />
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
</head>

<body class="bg-light position-relative">

  <!-- Decoration BG (Añadido) -->
  <div class="decoration-bg">
    <div class="blur-shape shape-1"></div>
    <div class="blur-shape shape-2" style="bottom: 10%; right: 20%;"></div>
  </div>

  <!-- HEADER -->
  <header class="header-custom sticky-top bg-white border-bottom border-light shadow-sm">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <a href="mainpage.html" class="d-flex align-items-center text-decoration-none">
        <!-- Logo (Reemplazado) -->
        <img src="img/LOGOPROYECTO1.png" alt="Logo CalibraX" class="logo-img me-2" style="height: 40px;">
      </a>
      <nav class="d-flex align-items-center">
        <span class="d-none d-md-block text-secondary me-3 small">Bienvenido</span>
        <button class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="logout()">
          <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
        </button>
      </nav>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="container my-5 position-relative z-1" style="min-height: 70vh;">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold text-dark mb-1">Mis Proyectos</h2>
        <p class="text-secondary small">Gestiona tus inspecciones y reportes.</p>
      </div>
    </div>

    <div class="row">
      <!-- Alertas -->
      <div id="proyectosInfo" class="alert alert-info border-0 shadow-sm rounded-3" style="display:none;">
        <i class="bi bi-info-circle me-2"></i> Cargando proyectos...
      </div>

      <!-- Grid de Proyectos -->
      <div class="proyectos-grid w-100" id="proyectosContainer">
        <!-- Los proyectos se inyectan aquí via JS -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-custom py-4 bg-white border-top border-light mt-auto position-relative z-1">
    <div class="container text-center">
      <p class="small mb-0 text-secondary">© 2025 CalibraX. Plataforma de Clientes.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- Lógica Original (Sin Cambios) -->
  <script src="app.videos.js"></script>
  
  <script>
    function logout() {
      localStorage.removeItem('authToken');
      window.location.href = "mainpage.html";
    }
  </script>
</body>
</html>
