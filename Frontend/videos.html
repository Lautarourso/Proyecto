<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CalibraX - Videos</title>
  <!-- Preconexiones para mejor performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=Racing+Sans+One&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <!-- Estilos personalizados -->
  <link href="css/style.css" rel="stylesheet" />
  <!-- Favicon -->
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <style>
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    
    .video-card {
      background-color: var(--gris-claro);
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      color: var(--negro);
    }
    
    .video-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    
    .video-thumbnail {
      position: relative;
      height: 160px;
      background-color: var(--azul-oscuro);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .video-thumbnail i {
      font-size: 3rem;
      color: rgba(255,255,255,0.8);
      transition: all 0.3s ease;
    }
    
    .video-card:hover .video-thumbnail i {
      transform: scale(1.1);
      color: var(--blanco);
    }
    
    .video-info {
      padding: 1rem;
    }
    
    .video-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .video-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #666;
    }
    
    .folder-sidebar {
      background-color: var(--gris-claro);
      border-radius: 8px;
      padding: 1.5rem;
      color: var(--negro);
      height: 100%;
    }
    
    .folder-list {
      margin-top: 1rem;
    }
    
    .folder-item {
      display: flex;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .folder-item:hover {
      background-color: rgba(0,0,0,0.05);
    }
    
    .folder-item i {
      margin-right: 0.5rem;
      color: var(--naranja);
    }
    
    @media (max-width: 767.98px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
      
      .sidebar-col {
        margin-top: 2rem;
      }
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="header-custom sticky-top">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <a href="mainpage.html" class="d-flex align-items-center text-decoration-none">
        <img src="img/logo.png" alt="Logo CalibraX" height="40" class="d-inline-block align-top me-2">
        <span class="fs-5 fw-bold text-dark d-none d-md-inline">CALIBRAX</span>
      </a>
      <button class="navbar-toggler d-md-none border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
        <i class="bi bi-list" style="font-size: 1.5rem;"></i>
      </button>
      <nav class="collapse navbar-collapse justify-content-end" id="navbarCollapse">
        <div class="d-flex flex-column flex-md-row align-items-center">
          <a href="#" class="nav-link-custom mx-2 mx-md-3">Servicios</a>
          <a href="#" class="nav-link-custom mx-2 mx-md-3">Quiénes somos</a>
          <a href="#" class="nav-link-custom mx-2 mx-md-3">Contacto</a>
          <button class="btn btn-sm btn-outline-danger ms-md-3 mt-2 mt-md-0" onclick="logout()">
            <i class="bi bi-box-arrow-left me-1"></i>Cerrar Sesión
          </button>
        </div>
      </nav>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="container my-4 my-lg-5">
    <div class="row">
      <!-- Área de Videos -->
      <div class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="mb-0">Videos Disponibles</h2>
          <div class="d-flex">
            <div class="input-group input-group-sm" style="max-width: 250px;">
              <input type="text" class="form-control" placeholder="Buscar videos...">
              <button class="btn btn-orange-custom" type="button">
                <i class="bi bi-search"></i>
              </button>
            </div>
            <button class="btn btn-orange-custom ms-2" data-bs-toggle="modal" data-bs-target="#uploadModal">
              <i class="bi bi-cloud-arrow-up me-1"></i>Subir
            </button>
          </div>
        </div>
        
        <div id="videosInfo" class="alert alert-info">
          <i class="bi bi-info-circle me-2"></i>Cargando videos...
        </div>
        
        <div class="video-grid" id="videoContainer">
          <!-- Los videos se cargarán aquí dinámicamente -->
        </div>
      </div>
      
      <!-- Sidebar de Carpetas -->
      <div class="col-lg-3 sidebar-col">
        <div class="folder-sidebar sticky-top" style="top: 80px;">
          <div class="d-flex justify-content-between align-items-center">
            <h4 class="mb-0"><i class="bi bi-folder-fill me-2"></i>Carpetas</h4>
            <button class="btn btn-sm btn-orange-custom" data-bs-toggle="modal" data-bs-target="#newFolderModal">
              <i class="bi bi-plus-lg"></i>
            </button>
          </div>
          
          <div class="folder-list mt-3">
            <div class="folder-item">
              <i class="bi bi-folder-fill"></i>
              <span>Todos los videos</span>
              <span class="badge bg-secondary ms-auto">24</span>
            </div>
            <div class="folder-item">
              <i class="bi bi-folder-fill"></i>
              <span>Proyecto Bahía</span>
              <span class="badge bg-secondary ms-auto">8</span>
            </div>
            <div class="folder-item">
              <i class="bi bi-folder-fill"></i>
              <span>Informes Técnicos</span>
              <span class="badge bg-secondary ms-auto">5</span>
            </div>
            <div class="folder-item">
              <i class="bi bi-folder-fill"></i>
              <span>Capacitaciones</span>
              <span class="badge bg-secondary ms-auto">11</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Subir Video -->
  <div class="modal fade" id="uploadModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header modal-header-custom">
          <h5 class="modal-title"><i class="bi bi-cloud-arrow-up me-2"></i>Subir Video</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="videoTitle" class="form-label">Título del video</label>
              <input type="text" class="form-control" id="videoTitle" required>
            </div>
            <div class="mb-3">
              <label for="videoDescription" class="form-label">Descripción</label>
              <textarea class="form-control" id="videoDescription" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label for="videoFolder" class="form-label">Carpeta</label>
              <select class="form-select" id="videoFolder">
                <option value="">Seleccionar carpeta</option>
                <option value="1">Proyecto Bahía</option>
                <option value="2">Informes Técnicos</option>
                <option value="3">Capacitaciones</option>
              </select>
            </div>
            <div class="mb-4">
              <label for="videoFile" class="form-label">Archivo de video</label>
              <input class="form-control" type="file" id="videoFile" accept="video/*" required>
              <div class="form-text">Formatos soportados: MP4, MOV, AVI (Máx. 500MB)</div>
            </div>
            <button type="submit" class="btn-orange-custom w-100">
              <i class="bi bi-cloud-arrow-up me-2"></i>Subir Video
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Nueva Carpeta -->
  <div class="modal fade" id="newFolderModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header modal-header-custom">
          <h5 class="modal-title"><i class="bi bi-folder-plus me-2"></i>Nueva Carpeta</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="folderName" class="form-label">Nombre de la carpeta</label>
              <input type="text" class="form-control" id="folderName" required>
            </div>
            <div class="mb-3">
              <label for="folderColor" class="form-label">Color</label>
              <div class="d-flex gap-2">
                <div class="color-option" data-color="#E24B16" style="background-color: #E24B16;"></div>
                <div class="color-option" data-color="#003366" style="background-color: #003366;"></div>
                <div class="color-option" data-color="#28a745" style="background-color: #28a745;"></div>
                <div class="color-option" data-color="#6f42c1" style="background-color: #6f42c1;"></div>
                <div class="color-option" data-color="#fd7e14" style="background-color: #fd7e14;"></div>
              </div>
              <input type="hidden" id="selectedColor" value="#E24B16">
            </div>
            <button type="submit" class="btn-orange-custom w-100">
              <i class="bi bi-folder-plus me-2"></i>Crear Carpeta
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer-custom py-4 mt-5">
    <div class="container">
      <div class="row">
        <div class="col-md-6 text-center text-md-start">
          <p class="small mb-0">© 2025
