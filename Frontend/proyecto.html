<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CalibraX - Proyecto</title>
  
  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mango+Grotesque:wght@700&family=Basement+Grotesque:wght@700&family=Hanson:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <link href="css/styleproyecto.css" rel="stylesheet" />
</head>
<body>
  <div class="liquid-bg"></div>
  <!-- Barra de progreso -->
  <div id="progressBar" class="progress-bar-custom"></div>

  <!-- HEADER -->
  <header class="header-custom sticky-top">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <a href="videos.html" class="d-flex align-items-center text-decoration-none">
        <img src="img/LOGOPROYECTO1.png" alt="Logo CalibraX" height="50" class="me-2">
        <span class="fs-4 fw-bold text-light d-none d-md-inline">CALIBRAX</span>
      </a>
      <nav class="d-flex align-items-center">
        <button class="btn btn-sm btn-outline-orange ms-3" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </button>
      </nav>
    </div>
  </header>

  <!-- CONTENIDO -->
  <main class="container my-5">
    <div class="row">
      <div class="col-12 mb-4 text-center">
        <h2 class="text-light" id="nombreProyecto">Proyecto:</h2>
        <p class="text-muted" id="infoProyecto"></p>
      </div>

      <div id="proyecto-detalle" class="text-center mb-5">
        <div id="videosContainer"></div>
      </div>

      <hr class="text-light">

      <!-- FORMULARIO DE MATERIALES -->
      <section id="material-section" class="mt-5">
        <h3 class="text-light mb-3">Datos del material del gasoducto</h3>
        <form id="materialForm" class="text-light">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Tipo de falla:</label>
              <input type="text" id="falla" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Material del gasoducto:</label>
              <input type="text" id="material" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Espesor (mm):</label>
              <input type="number" id="espesor" step="0.01" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Diámetro (mm):</label>
              <input type="number" id="diametro" step="0.01" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Antigüedad (años):</label>
              <input type="number" id="antiguedad" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">TFME (MPa):</label>
              <input type="number" id="tfme" step="0.01" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Presión habitual (bar):</label>
              <input type="number" id="presionHabitual" step="0.01" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Presión máxima (bar):</label>
              <input type="number" id="presionMaxima" step="0.01" class="form-control" required>
            </div>
               
            <!-- ESPACIO PARA SEPARAR -->
            <div class="col-12 mb-4"></div>
            
            <div class="col-md-6">
              <label class="form-label">Latitud inicial:</label>
              <input type="text" id="latitudInicial" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Latitud final:</label>
              <input type="text" id="latitudFinal" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Longitud inicial:</label>
              <input type="text" id="longitudInicial" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Longitud final:</label>
              <input type="text" id="longitudFinal" class="form-control" required>
            </div>
          </div>
          <div class="text-center mt-4">
            <button type="button" id="btnAccion" class="btn btn-orange-custom">
              <i class="bi bi-gear-wide-connected me-2"></i>Cargar datos
            </button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer-custom py-4 mt-5">
    <div class="container text-center">
      <p class="small mb-0">© 2025 CalibraX. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function logout() {
      localStorage.removeItem('authToken');
      window.location.href = "mainpage.html";
    }

    // Barra de progreso scroll
    window.addEventListener('scroll', function () {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      const progressBar = document.getElementById('progressBar');
      progressBar.style.width = scrolled + '%';
      progressBar.style.opacity = winScroll > 100 ? '1' : '0';
    });
  </script>

  <script src="app.proyectos.js"></script>
</body>
</html>
